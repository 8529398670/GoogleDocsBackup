[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "google-docs-backup"
dynamic = ["version"]
description = "Back up Google Drive accounts with rclone + pandoc, with tar.gz snapshots"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
google-docs-backup = "google_docs_backup.cli:main"

[tool.setuptools]
packages = ["google_docs_backup"]

[tool.setuptools.dynamic]
version = { attr = "google_docs_backup.__version__" }
