# google-docs-backup settings. Everything tweakable lives here.

paths:
  # rclone / pandoc programs. Leave empty (or wrong) and the next run looks them
  # up (bin folder, PATH, /opt/homebrew/bin, /usr/local/bin, /usr/bin, ...)
  # and writes what it found here.
  rclone_exe: ./bin/rclone.exe
  pandoc_exe: ./bin/pandoc.exe
  bin: ./bin                     # where fetch-tools (Windows) downloads them to (git-ignored)
  # Relative paths are relative to this file (the repo root).
  # private/, logs/, backups/ and snapshots/ are all git-ignored.
  rclone_config: ./private/rclone.conf  # holds Google tokens - never commit
  backup_dir: ./backups                 # the live backup, one subfolder per remote
  log: ./logs/backup.log

# One rclone remote per Google account. Set enabled: false to skip one.
remotes:
# "label" is optional and only shown in the progress bars.
  - {name: gdrive,  enabled: true}
  - {name: gdrive2, enabled: true}

# After each run, pack backup_dir/<remote> into one tar.gz and upload it to
# <remote>:Backups/snapshot-14NOV2026.tar.gz. A second run on the same
# day replaces that day's snapshot.
snapshot:
  enabled: true
  name_prefix: snapshot-
  local_dir: ./snapshots   # local copies, one subfolder per remote
  keep_local: 3            # newest N kept here; older ones deleted (0 = keep none)
  keep_drive: 3            # newest N kept in Drive; older ones go to Drive's trash
  compress_level: 6        # gzip 1 (fast) .. 9 (smallest)

# Also mirror backup_dir/<remote> file-by-file into Drive (the old behaviour).
upload_to_drive: false

# Google native files are exported as these formats (and only these are copied).
export_formats: [docx, xlsx, pptx]

# Extra rclone filter patterns to skip during the export. Each account's own
# Backups/ folder (where snapshots go) is always skipped automatically.
# A leading "/" anchors to the Drive root, e.g. ["/Old Stuff/**", "*.tmp.docx"]
exclude: []

rclone:
  log_level: NOTICE        # DEBUG | INFO | NOTICE | ERROR
  transfers: 4
  checkers: 8
  extra_args: []           # e.g. ["--tpslimit", "10"]

markdown:
  enabled: true
  pandoc_to: markdown      # e.g. gfm for GitHub-flavoured markdown
  wrap: none
  media_suffix: ._media    # "Doc.docx" -> images in "Doc._media" (matches the old script)
  only_if_newer: true      # skip docs whose .md is already newer than the .docx
  workers: 4               # parallel pandoc processes
  extra_args: []

# Scheduled runs: `google-docs-backup service install` sets this up with the OS's own
# scheduler (Windows Task Scheduler / macOS launchd / systemd timer on Linux).
service:
  name: google_docs_backup   # task name / launchd label / systemd unit base name
  days: [sunday]             # which weekdays; [] = every day
  time: "03:00"              # 24h local time
  windows_run_as: system     # system (needs admin, runs while logged out) | user
  linux_scope: user          # user (~/.config/systemd/user) | system (/etc/systemd, needs root)

progress: auto            # auto (bars only in a real terminal) | on | off

tools:
  rclone_url: https://downloads.rclone.org/rclone-current-windows-amd64.zip
  pandoc_release_api: https://api.github.com/repos/jgm/pandoc/releases/latest
  pandoc_asset_glob: pandoc-*-windows-x86_64.zip

auth:
  task_prefix: google_docs_backup_auth-
  timeout_seconds: 90
